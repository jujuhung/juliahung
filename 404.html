<!-- 404.html is served for any missing path, so "relative" would mean
     whatever the visitor typed. Resolve the site root first: one path
     segment on a github.io project site, the domain root everywhere else.
     Without JavaScript the page still reads; it just loses its stylesheet. -->
<script>
(function () {
  var m = location.hostname.slice(-10) === ".github.io" &&
          location.pathname.match(/^\/[^\/]+\//);
  var root = m ? m[0] : "/";

  // Old Wix URLs. GitHub Pages cannot send a 301, so forward visitors on
  // old links from here instead. Search engines drop the old URLs on their
  // own; this is for people following links in press and bios.
  var path = location.pathname.slice(root.length - 1).replace(/\/+$/, "");
  try { path = decodeURIComponent(path); } catch (e) {}
  var moved = {
    "/artwork": "artworks/",
    "/artwork/-inter-symbiosis": "artworks/inter-symbiosis/",
    "/artwork/lost-and-found": "exhibitions/the-miscellaneous-of-being-and-living/",
    "/artwork/wonders-and-wonderers": "artworks/",
    "/copy-of-artworks-1": "artworks/",
    "/exhibition": "exhibitions/",
    "/exhibition/in-the-mood-for-egg-": "exhibitions/in-the-mood-for-egg/",
    "/exhibition/未央夜": "exhibitions/whennightfalls/",
    "/essence": "artworks/essence/",
    "/infinite": "artworks/infinite/",
    "/副本-infinite": "artworks/infinite/",
    "/portfolio": "artworks/",
    "/porfoliotodate": "artworks/",
    "/single-project": "artworks/",
    "/color-of-water": "artworks/",
    "/price-list": "contact/",
    "/blog-feed.xml": "blog/"
  };
  var to = moved[path], s;
  if (!to && (s = path.match(/^\/(artwork|exhibition)\/([^\/]+)$/)))
    to = s[1] + "s/" + s[2] + "/";
  // Only 3 of the 18 Wix posts were rebuilt; the rest are listed on /blog/.
  else if (!to && /^\/post\/[^\/]+$/.test(path))
    to = "blog/";
  if (to) { location.replace(root + to); return; }

  document.write('<base href="' + root + '">');
})();
</script>
